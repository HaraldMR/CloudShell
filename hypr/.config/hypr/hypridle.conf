# Idle, lock and sleep (hypridle)
# Locking goes through cloudshell (it refreshes hyprlock's wallpaper first);
# if the shell isn't running, hyprlock is started directly.

general {
    lock_cmd = qs -c cloudshell ipc call lock lock || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
}

# Lock after 15 minutes
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# Screens off after 18 minutes
listener {
    timeout = 1080
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
